<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>CTA Klostergarten-Buch</title>
<style>
  :root { --papier:#f3ecdc; --moos:#3f5a3a; --moos-d:#2f4530; --ocker:#a8823c; --gold:#b8913f; --tinte:#29271f; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:var(--papier); }
  #stage { position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--papier); }
  .papier { position:absolute; inset:0;
    background:
      radial-gradient(ellipse 75% 70% at 50% 45%, rgba(255,252,243,.95) 0%, rgba(243,236,220,0) 70%),
      radial-gradient(ellipse 120% 110% at 50% 50%, rgba(0,0,0,0) 55%, rgba(80,60,25,.28) 100%); }
  .korn { position:absolute; inset:-20px; opacity:.22; mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .25  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .tafel { position:absolute; width:620px; border-radius:6px; will-change:transform,opacity,filter;
    -webkit-mask-image:radial-gradient(ellipse 72% 70% at 50% 50%, #000 60%, transparent 100%); mix-blend-mode:multiply; }
  svg.rahmen { position:absolute; inset:0; }
  .buchwrap { position:absolute; left:330px; top:150px; width:520px; height:735px; perspective:1800px; }
  .buch { position:absolute; inset:0; transform-style:preserve-3d; }
  .buch img.cover { position:absolute; inset:0; width:100%; height:100%; border-radius:3px 9px 9px 3px;
    box-shadow:30px 38px 60px rgba(50,35,10,.42), 6px 8px 14px rgba(50,35,10,.25); }
  .buch .ruecken { position:absolute; left:0; top:0; width:26px; height:100%; transform-origin:left center; transform:rotateY(-90deg);
    background:linear-gradient(90deg,#1c2418,#334030 60%,#1c2418); }
  .buch .glanz { position:absolute; inset:0; border-radius:3px 9px 9px 3px; mix-blend-mode:screen; pointer-events:none;
    background:linear-gradient(105deg, rgba(255,255,255,0) 35%, rgba(255,248,225,.55) 50%, rgba(255,255,255,0) 65%); background-size:300% 100%; }
  .buch .falz { position:absolute; left:14px; top:0; width:10px; height:100%;
    background:linear-gradient(90deg, rgba(255,255,255,.18), rgba(0,0,0,.18)); }
  .text { position:absolute; left:930px; top:250px; width:900px; }
  .kicker { font:600 26px/1 "Segoe UI", system-ui, sans-serif; letter-spacing:.32em; color:var(--ocker); text-transform:uppercase; }
  .titel { font:700 88px/1.06 "Palatino Linotype", Palatino, Georgia, serif; color:var(--moos-d); margin-top:26px; }
  .sub { font:italic 34px/1.3 Georgia, serif; color:#5a5546; margin-top:26px; }
  .zeile { overflow:hidden; } .zeile > span { display:inline-block; }
  .plakette { position:absolute; left:960px; top:720px; padding:30px 54px 34px; border-radius:16px;
    background:linear-gradient(180deg,#fffaf0,#f6edd8); box-shadow:0 18px 40px rgba(60,40,10,.22);
    border:3px solid var(--gold); outline:1.5px solid rgba(184,145,63,.55); outline-offset:7px; }
  .plakette .url { font:700 74px/1 "Palatino Linotype", Palatino, Georgia, serif; color:var(--moos-d); letter-spacing:.01em; white-space:nowrap; }
  .plakette .hinweis { font:600 22px/1 "Segoe UI", system-ui, sans-serif; letter-spacing:.24em; color:var(--ocker); text-transform:uppercase; margin-bottom:16px; }
  .plakette .schimmer { position:absolute; inset:0; border-radius:13px; mix-blend-mode:screen;
    background:linear-gradient(100deg, rgba(255,255,255,0) 40%, rgba(255,240,200,.75) 50%, rgba(255,255,255,0) 60%); background-size:300% 100%; }
  .seite { position:absolute; width:400px; border-radius:4px; box-shadow:18px 22px 40px rgba(50,35,10,.32); background:#fff; }
</style></head>
<body><div id="stage">
  <div class="papier"></div>
  <img class="tafel" id="t1" src="img/teil03.jpg">
  <img class="tafel" id="t2" src="img/teil09.jpg">
  <img class="tafel" id="t3" src="img/teil10.jpg">
  <img class="tafel" id="t4" src="img/frontispiz.jpg">
  <svg class="rahmen" viewBox="0 0 1920 1080"><rect id="rahmen" x="56" y="56" width="1808" height="968" rx="10" fill="none" stroke="#b8913f" stroke-width="2.2" stroke-dasharray="5552" stroke-dashoffset="5552"/>
    <rect id="rahmen2" x="72" y="72" width="1776" height="936" rx="6" fill="none" stroke="#b8913f" stroke-opacity=".5" stroke-width="1" stroke-dasharray="5424" stroke-dashoffset="5424"/></svg>
  <img class="seite" id="s1" src="img/vorschau-teil.jpg">
  <img class="seite" id="s2" src="img/vorschau-methode.jpg">
  <img class="seite" id="s3" src="img/vorschau-kalender.jpg">
  <div class="buchwrap" id="buchwrap"><div class="buch" id="buch">
    <div class="ruecken"></div><img class="cover" src="img/buch-umschlag.jpg"><div class="falz"></div><div class="glanz" id="glanz"></div></div></div>
  <div class="text" id="text">
    <div class="zeile"><span class="kicker" id="k">Bruder Wendelins Klostergarten</span></div>
    <div class="zeile"><span class="titel" id="ti1">Das Klostergarten-</span></div>
    <div class="zeile"><span class="titel" id="ti2" style="margin-top:0">Buch</span></div>
    <div class="zeile"><span class="sub" id="sub">30 alte Methoden für Kräuter, Gemüse und gute Erde</span></div>
  </div>
  <div class="plakette" id="plakette"><div class="hinweis">Zu finden auf</div><div class="url" id="url">bruderwendelin.online</div><div class="schimmer" id="schimmer"></div></div>
  <div class="korn"></div>
</div>
<script>
// tempo (s) -> estilo. CUES vem do Python (as palavras da narracao); estes sao os padroes.
window.CUES = { B0: 7.0, TITEL: 8.4, URL: 11.0, C0: 13.2, FIM: 19.5 };
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => { x = cl(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const out = x => 1 - Math.pow(1 - cl(x), 3);
const prog = (t, a, d) => cl((t - a) / d);
const $ = id => document.getElementById(id);
function render(t) {
  const C = window.CUES;
  // camera: deriva lenta do cenario inteiro (push-in suave)
  const zoom = 1 + 0.035 * (t / C.FIM);
  $('stage').style.transform = `scale(${zoom})`;
  // CENA A: pranchas do herbario surgindo em camadas (parallax), recuam quando o livro entra
  const recuo = ease(prog(t, C.B0 - .8, 1.4));
  const plates = [ ['t1', 120, 120, -4, 0.0, 26], ['t2', 1180, 90, 3, 0.9, -20], ['t3', 640, 520, -2, 1.8, 14], ['t4', 1250, 560, 4, 2.7, -12] ];
  for (const [id, x, y, r, a0, dx] of plates) {
    const p = out(prog(t, a0, 1.6));
    const drift = dx * (t / 6);
    const op = p * (1 - .78 * recuo);
    $(id).style.opacity = op;
    $(id).style.filter = `blur(${(1 - p) * 8 + recuo * 5}px)`;
    $(id).style.transform = `translate(${x + drift}px, ${y + (1 - p) * 60 - recuo * 30}px) rotate(${r}deg) scale(${.94 + .06 * p + recuo * .08})`;
  }
  // moldura dourada desenhando
  $('rahmen').setAttribute('stroke-dashoffset', 5552 * (1 - ease(prog(t, .3, 2.6))));
  $('rahmen2').setAttribute('stroke-dashoffset', 5424 * (1 - ease(prog(t, .8, 2.6))));
  // CENA B: o livro sobe girando
  const b = ease(prog(t, C.B0, 1.5));
  const cC = ease(prog(t, C.C0, 1.2));
  $('buchwrap').style.opacity = b;
  const rotY = -62 + 44 * b - 6 * cC, x = -40 * (1 - b) - 150 * cC, y = 140 * (1 - b) + 20 * cC, sc = .9 + .1 * b - .12 * cC;
  $('buch').style.transform = `translateX(${x}px) translateY(${y}px) rotateY(${rotY}deg) rotateX(${4 * (1 - b)}deg) scale(${sc})`;
  const g = prog(t, C.B0 + 1.1, 1.3);
  $('glanz').style.backgroundPosition = `${150 - 200 * g}% 0`; $('glanz').style.opacity = g > 0 && g < 1 ? 1 : 0;
  // titulo, linha a linha
  const linhas = [['k', 0], ['ti1', .18], ['ti2', .36], ['sub', .62]];
  for (const [id, d] of linhas) {
    const p = out(prog(t, C.TITEL + d, .9));
    const sobe = ease(prog(t, C.C0, 1.0));
    $(id).style.transform = `translateY(${(1 - p) * 110}%)`;
    $(id).style.opacity = p * (1 - .0 * sobe);
  }
  $('text').style.transform = `translate(${-60 * cC}px, ${-40 * cC}px)`;
  $('text').style.opacity = 1 - cC;
  $('text').style.transformOrigin = 'left top';
  // placa do endereco: entra, letras reveladas, brilho uma vez
  const u = out(prog(t, C.URL - .15, .7));
  $('plakette').style.opacity = u;
  $('plakette').style.transform = `translateY(${(1 - u) * 40 - 0 * cC}px) scale(${.96 + .04 * u})`;
  const letras = ease(prog(t, C.URL, .9));
  $('url').style.clipPath = `inset(0 ${100 - 100 * letras}% 0 0)`;
  const sh = prog(t, C.URL + 1.0, 1.1);
  $('schimmer').style.backgroundPosition = `${160 - 220 * sh}% 0`; $('schimmer').style.opacity = sh > 0 && sh < 1 ? 1 : 0;
  // na cena C a placa desce para o centro de baixo e fica
  $('plakette').style.left = `${960 - 80 * cC}px`; $('plakette').style.top = `${720 + 90 * cC}px`;
  // CENA C: tres paginas de verdade abrem em leque atras do texto
  const fan = [['s1', -9, 0], ['s2', 0, .15], ['s3', 9, .3]];
  for (const [id, r, d] of fan) {
    const p = out(prog(t, C.C0 + .3 + d, 1.2));
    const xs = 1060 + (r / 9) * 300, ys = 150 + Math.abs(r) * 4;
    $(id).style.opacity = p;
    $(id).style.transform = `translate(${xs - 120 * (1 - p)}px, ${ys + 80 * (1 - p)}px) rotate(${r * p}deg) scale(${.85 + .15 * p})`;
    $(id).style.zIndex = 1;
  }
}
render(0);
</script></body></html>
